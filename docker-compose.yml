services:
  bookshop:
    build:
      context: .
      dockerfile: BookShopmvc/Dockerfile
    container_name: bookshop
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=BookShop;Username=postgres;Password=123"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: BookShop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BookShop"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: